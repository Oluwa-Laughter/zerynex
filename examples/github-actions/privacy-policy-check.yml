# Copy this workflow to an integrating Zcash repository.
# ONLY commit synthetic non-spendable PCZT fixtures; never wallet files.
name: Zcash PCZT privacy policy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  privacy-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pin Zerynex to a reviewed commit SHA for production use.
      # @main here is an easy-to-try example, NOT an immutable release.
      - name: Check synthetic wallet fixture
        id: privacy
        uses: Oluwa-Laughter/zerynex@main
        with:
          pczt-path: tests/fixtures/clean-v6.bin
          policy-path: policies/shielded-only.json
          input-format: binary
          fail-on-findings: 'true'
      - name: Confirm fixture passes the selected policy
        shell: bash
        env:
          ZERYNEX_PASSED: ${{ steps.privacy.outputs.passed }}
        run: test "$ZERYNEX_PASSED" = true
