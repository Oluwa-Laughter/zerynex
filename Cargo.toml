[package]
name = "zerynex"
default-run = "zerynex"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Local Zcash PCZT privacy policy linting"
# Rust library/CLI consumers need Rust sources and reviewed test fixtures,
# not the website, Python/TypeScript package trees or maintainer tooling.
include = [
  "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE",
  "/src/**", "/examples/*.rs", "/tests/*.rs", "/tests/fixtures/**",
  "/rules/**", "/policies/**",
  "/apps/web/public/examples/*.bin",
]
repository = "https://github.com/Oluwa-Laughter/zerynex"
homepage = "https://zerynex.vercel.app"
readme = "README.md"
keywords = ["zcash", "pczt", "privacy", "wallet", "development"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
browser = ["dep:wasm-bindgen"]

[dependencies]
pczt = "0.9.3"
base64 = "0.23.1"
zcash_address = "0.13.0"
zcash_protocol = "0.10.6"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
