[package]
name = "zerynex"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Local Zcash PCZT privacy policy linting"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
browser = ["dep:wasm-bindgen"]

[dependencies]
pczt = "0.9.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
