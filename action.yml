name: Zerynex PCZT Privacy Policy
description: Check synthetic Zcash PCZT fixtures against Rust-backed privacy policies in pull requests.
author: Zerynex contributors
branding:
  icon: shield
  color: purple
inputs:
  pczt-path:
    description: Path to a synthetic PCZT fixture within the caller repository.
    required: false
    default: ''
  scenario-manifest:
    description: Optional node-free role-handoff manifest; mutually exclusive with pczt-path and baseline-path.
    required: false
    default: ''
  baseline-path:
    description: Optional initial PCZT stage fixture; compares against pczt-path instead of inspecting one fixture.
    required: false
    default: ''
  policy-path:
    description: Optional JSON policy path within the caller repository.
    required: false
    default: ''
  input-format:
    description: Binary or base64 PCZT transport.
    required: false
    default: binary
  deny-transparent:
    description: Disallow transparent PCZT inputs and outputs.
    required: false
    default: 'true'
  deny-sapling:
    description: Prohibit Sapling components in this particular application policy.
    required: false
    default: 'false'
  fail-on-findings:
    description: Fail this job when Rust reports policy findings.
    required: false
    default: 'true'
  sarif-output:
    description: Optional relative .sarif output path inside the checked-out repository for redacted analysis findings. Requires an existing parent directory; not supported with scenario-manifest.
    required: false
    default: ''
outputs:
  finding-count:
    description: Number of sanitized disclosure policy findings.
    value: ${{ steps.report.outputs.finding_count }}
  scenario-count:
    description: Number of expected synthetic role-handoff scenarios in the manifest.
    value: ${{ steps.report.outputs.scenario_count }}
  scenario-matched:
    description: Number of synthetic handoff scenarios that matched their expected policy behavior.
    value: ${{ steps.report.outputs.scenario_matched }}
  regression-count:
    description: Count of newly added rule findings and PCZT structure changes when baseline-path is used.
    value: ${{ steps.report.outputs.regression_count }}
  passed:
    description: 'true only when current policy checks pass and, for comparisons, component structure is unchanged.'
    value: ${{ steps.report.outputs.passed }}
  sarif-path:
    description: Relative sanitized SARIF report path when sarif-output is requested. No source files or PCZT bytes are embedded.
    value: ${{ steps.report.outputs.sarif_path }}
runs:
  using: composite
  steps:
    - name: Install trusted Rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Build Zerynex from this action source
      shell: bash
      env:
        CARGO_TARGET_DIR: ${{ runner.temp }}/zerynex-target
      run: cargo build --locked --release --manifest-path "$GITHUB_ACTION_PATH/Cargo.toml" --bins
    - name: Check the local PCZT using configured policy
      id: report
      shell: bash
      env:
        ZERYNEX_ACTION_BIN: ${{ runner.temp }}/zerynex-target/release/zerynex
        ZERYNEX_HANDOFF_BIN: ${{ runner.temp }}/zerynex-target/release/zerynex-handoff
        ZERYNEX_SCENARIO_MANIFEST: ${{ inputs.scenario-manifest }}
        ZERYNEX_PCZT_PATH: ${{ inputs.pczt-path }}
        ZERYNEX_BASELINE_PATH: ${{ inputs.baseline-path }}
        ZERYNEX_POLICY_PATH: ${{ inputs.policy-path }}
        ZERYNEX_INPUT_FORMAT: ${{ inputs.input-format }}
        ZERYNEX_DENY_TRANSPARENT: ${{ inputs.deny-transparent }}
        ZERYNEX_DENY_SAPLING: ${{ inputs.deny-sapling }}
        ZERYNEX_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        ZERYNEX_SARIF_OUTPUT: ${{ inputs.sarif-output }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/action_check.py"
