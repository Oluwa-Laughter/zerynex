[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerynex-python"
version = "0.1.0"
description = "Local Zcash PCZT privacy-policy analysis with the Zerynex Rust CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []
keywords = ["zcash", "privacy", "pczt", "cryptography", "developer-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries :: Python Modules"
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8"]

[project.scripts]
zerynex-mcp = "zerynex_py.mcp_server:main"
zerynex-mcp-doctor = "zerynex_py.mcp_doctor:main"
zerynex-z3-check = "zerynex_py.z3:main"
zerynex-node-check = "zerynex_py.node:main"
zerynex-rpc-check = "zerynex_py.rpc_contract:main"
zerynex-agent-preflight = "zerynex_py.preflight:main"
zerynex-project = "zerynex_py.project:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
zerynex_py = ["fixtures/*.json", "fixtures/*.bin"]
