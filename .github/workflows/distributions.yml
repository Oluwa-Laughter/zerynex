name: Zerynex Distribution Artifacts
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/distributions.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'packages/sdk/**'
      - 'packages/python/**'
      - 'scripts/package-cli.py'
      - 'scripts/test-cli-package.py'
      - 'scripts/test-sdk-packed.mjs'
      - 'scripts/test-python-wheel.py'
      - 'scripts/check-release-version.py'
      - 'apps/web/src/wasm/**'

permissions:
  contents: read

jobs:
  cli:
    name: OS-native CLI / ${{ matrix.slug }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            slug: linux
          - os: macos-latest
            slug: macos
          - os: windows-latest
            slug: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag aligns with all three package versions
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            python scripts/check-release-version.py "$GITHUB_REF_NAME"
          else
            python scripts/check-release-version.py
          fi
      - name: Compile standalone release executables
        run: cargo build --release --locked --bins
      - name: Package executable and public documentation
        run: python scripts/package-cli.py --out dist/cli
      - name: Verify SHA-256 and run independently extracted executable
        run: python scripts/test-cli-package.py dist/cli
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.slug }}
          path: dist/cli/*
          if-no-files-found: error
          retention-days: 14

  sdk:
    name: npm tarball / bundled real Rust WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ensure all package versions match
        run: python3 scripts/check-release-version.py
      - name: Compile canonical Rust WASM, do not trust stale committed build
        run: bash scripts/build-wasm.sh
      - name: Build TypeScript SDK with matching WASM
        working-directory: packages/sdk
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
      - name: Verify tarball from a clean external npm consumer
        run: node scripts/test-sdk-packed.mjs
      - name: Produce distributable tarball
        run: |
          mkdir -p dist/npm
          cd packages/sdk
          npm pack --pack-destination ../../dist/npm --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-sdk
          path: dist/npm/*.tgz
          if-no-files-found: error
          retention-days: 14

  python:
    name: Python SDK wheel / clean install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Ensure all package versions match
        run: python scripts/check-release-version.py
      - name: Compile trusted Rust CLI
        run: cargo build --locked --bin zerynex
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build packages/python --sdist --wheel --outdir dist/python
      - name: Install wheel in unrelated Python virtualenv and run real fixture
        run: python scripts/test-python-wheel.py dist/python
      - uses: actions/upload-artifact@v4
        with:
          name: python-sdk
          path: dist/python/*
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish GitHub Release for an explicit version tag
    runs-on: ubuntu-latest
    needs: [cli, sdk, python]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Confirm version tag
        run: python3 scripts/check-release-version.py "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: dist
          merge-multiple: true
      - name: Verify and flatten downloadable assets
        run: python3 scripts/prepare-release-assets.py dist release-assets
      - name: Create versioned assets (no automatic npm/PyPI publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --verify-tag --generate-notes \
            --title "Zerynex $GITHUB_REF_NAME"
