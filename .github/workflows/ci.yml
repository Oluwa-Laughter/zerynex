name: Zerynex CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: zerynex-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust and WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Verify release artifact safety gate
        run: python3 -m unittest discover -s tests -p test_release_assets.py
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test all targets
        run: cargo test --locked --all-targets
      - name: Verify deterministic PCZT role fixtures
        run: cargo run --locked --example generate_role_handoff -- --check
      - name: Run node-free PCZT role-handoff scenarios
        run: cargo run --locked --bin zerynex-handoff -- --manifest tests/fixtures/role-handoff/scenario.json --json
      - name: Verify shipped browser role fixtures match upstream-generated test vectors
        shell: bash
        run: |
          for fixture in tests/fixtures/role-handoff/*; do
            cmp "$fixture" "apps/web/public/examples/role-handoff/$(basename "$fixture")"
          done
      - name: Check browser compilation
        run: cargo check --locked --target wasm32-unknown-unknown --features browser

  web:
    name: Next.js and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            apps/web/pnpm-lock.yaml
            packages/sdk/pnpm-lock.yaml
      - name: Compile local WASM analysis engine
        run: bash scripts/build-wasm.sh
      - name: Privacy policy smoke tests (synthetic only)
        shell: bash
        run: |
          cargo run --locked -- apps/web/public/examples/clean-v6.bin --policy-file policies/shielded-only.json --json
          set +e
          cargo run --locked -- apps/web/public/examples/transparent-v6.bin --policy-file policies/shielded-only.json --json
          status=$?
          set -e
          test "$status" -eq 2
      - name: Install SDK dependencies
        working-directory: packages/sdk
        run: pnpm install --frozen-lockfile
      - name: Build and unit-test reusable SDK
        working-directory: packages/sdk
        run: |
          pnpm build
          pnpm test
      - name: Verify distributable SDK from a clean offline consumer
        run: node scripts/test-sdk-packed.mjs
      - name: Install frontend dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: Build Next.js
        working-directory: apps/web
        run: pnpm build
      - name: Type-check
        working-directory: apps/web
        run: pnpm typecheck
      - name: Lint
        working-directory: apps/web
        run: pnpm lint
      - name: Verify binary assets
        run: test -s apps/web/public/wasm/zerynex_bg.wasm && test -s apps/web/public/examples/flagged-v6.bin
      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: apps/web
        run: pnpm test:e2e

  sdk-installers:
    name: SDK package manager compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, yarn]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Yarn classic
        if: matrix.manager == 'yarn'
        run: npm install --global yarn@1.22.22
      - name: Install with npm
        if: matrix.manager == 'npm'
        working-directory: packages/sdk
        run: npm install --no-package-lock --ignore-scripts
      - name: Install with Yarn
        if: matrix.manager == 'yarn'
        working-directory: packages/sdk
        run: yarn install --no-lockfile --ignore-scripts
      - name: Build SDK and run unit tests
        working-directory: packages/sdk
        run: |
          npm run build
          npm test

  python-agents:
    name: Python SDK and read-only MCP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile trusted Rust engine
        run: cargo build --locked
      - name: Install Python SDK with optional official MCP runtime
        run: python -m pip install './packages/python[mcp]'
      - name: Run Python/Rust and MCP protocol integration tests
        run: python -m unittest discover -s packages/python/tests -v
      - name: Verify real MCP stdio process with official client
        run: |
          zerynex-mcp-doctor             --server "$(command -v zerynex-mcp)"             --cli "$(pwd)/target/debug/zerynex"             --fixtures "$(pwd)/apps/web/public/examples"
      - name: Verify Python wheel from a clean consumer virtualenv
        run: |
          python -m pip install build
          python -m build packages/python --sdist --wheel --outdir dist/python
          python scripts/test-python-wheel.py dist/python
      - name: Validate portable Agent Skill structure
        run: python scripts/validate-agent-skill.py
      - name: Verify CLI never writes a wallet secret to findings
        run: |
          python - <<'PY'
          from pathlib import Path
          from zerynex_py import ZerynexClient, Policy
          cli = ZerynexClient(cli=Path('target/debug/zerynex').resolve())
          report = cli.analyze_file(
              'apps/web/public/examples/transparent-v6.bin',
              Policy(deny_transparent=True),
          )
          assert not report.passed
          assert report.findings[0].rule == 'PCZT-TRANSPARENT-OUTPUTS'
          PY

  consumer-action:
    name: Reusable action consumer verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Analyze clean synthetic fixture
        id: clean
        uses: ./
        with:
          pczt-path: apps/web/public/examples/clean-v6.bin
          policy-path: policies/shielded-only.json
      - name: Assert clean PCZT passes
        env:
          PASSED: ${{ steps.clean.outputs.passed }}
          COUNT: ${{ steps.clean.outputs.finding-count }}
        run: test "$PASSED" = true && test "$COUNT" = 0
      - name: Find transparent policy violations without failing job
        id: flagged
        uses: ./
        with:
          pczt-path: apps/web/public/examples/transparent-v6.bin
          fail-on-findings: 'false'
      - name: Assert findings are surfaced to consuming workflow
        env:
          PASSED: ${{ steps.flagged.outputs.passed }}
          COUNT: ${{ steps.flagged.outputs.finding-count }}
        run: test "$PASSED" = false && test "$COUNT" = 1
      - name: Compare stages with the reusable action
        id: stages
        uses: ./
        with:
          baseline-path: apps/web/public/examples/clean-v6.bin
          pczt-path: apps/web/public/examples/flagged-v6.bin
          fail-on-findings: 'false'
      - name: Assert new disclosure is detected
        env:
          PASSED: ${{ steps.stages.outputs.passed }}
          REGRESSIONS: ${{ steps.stages.outputs.regression-count }}
        run: test "$PASSED" = false && test "$REGRESSIONS" = 1
      - name: Run synthetic role-handoff fixture scenarios as a consumer
        id: handoff
        uses: ./
        with:
          scenario-manifest: tests/fixtures/role-handoff/scenario.json
      - name: Assert all role scenarios matched
        env:
          PASSED: ${{ steps.handoff.outputs.passed }}
          COUNT: ${{ steps.handoff.outputs.scenario-count }}
          MATCHED: ${{ steps.handoff.outputs.scenario-matched }}
        run: test "$PASSED" = true && test "$COUNT" = 4 && test "$MATCHED" = 4
      - name: Exercise standalone action consumer tests
        env:
          ZERYNEX_ACTION_BIN: ${{ runner.temp }}/zerynex-target/release/zerynex
        run: python3 -m unittest discover -s tests -p 'test_action_check.py' -v

  go-sdk:
    name: Go SDK against real Rust CLI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Build canonical Rust analyzer
        run: cargo build --locked --bin zerynex
      - name: Verify Go source formatting
        run: |
          cd packages/go
          test -z "$(gofmt -l .)"
      - name: Test Go SDK against real synthetic Rust PCZT fixtures
        working-directory: packages/go
        env:
          ZERYNEX_TEST_CLI: ${{ github.workspace }}/target/debug/zerynex
          ZERYNEX_TEST_FIXTURES: ${{ github.workspace }}/apps/web/public/examples
        run: go test -race -v ./...

  rpc-contracts:
    name: Offline Zallet RPC contracts and documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify docs catalog is synchronized with source
        run: |
          node scripts/sync-docs.mjs
          git diff --exit-code -- apps/web/content/docs
      - name: Validate canonical documentation and local links
        run: node scripts/validate-docs.mjs
      - name: Check synthetic OpenRPC method contract
        run: python3 scripts/check_rpc_contract.py --schema tests/fixtures/rpc/zallet-synthetic-openrpc.json --contract tests/fixtures/rpc/zallet-minimum-contract.json --json
      - name: Verify synthetic full PCZT lifecycle contract (strict additive requirements)
        run: python3 scripts/check_rpc_contract.py --schema tests/fixtures/rpc/zallet-pczt-lifecycle-synthetic-openrpc.json --contract tests/fixtures/rpc/zallet-pczt-lifecycle-contract.json --deny-new-required --json
      - name: Offline RPC compatibility tests
        run: python3 -m unittest discover -s tests -p test_rpc_contract.py -v
